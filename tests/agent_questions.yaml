# tests/agent_questions.yaml
# Benchmark questions for SC.AGENTS.AGT_SUPPLY_CHAIN (AGENTS.md suite item 4): each agent answer must match
# the equivalent SEMANTIC_VIEW() query. tests/consistency_tests.sql (test E_AGENT_MATCHES_SEMANTIC_VIEW)
# runs these questions through SNOWFLAKE.CORTEX.DATA_AGENT_RUN (the Cortex Agents Run API) and computes the
# expected values from the queries below at run time, so nothing here is a hard-coded number.
# Keep the questions and checks in sync with that test.
# "expected_today" = the value on 2026-10-04, for humans only.
#
# Two sections:
#   questions        the agent benchmark of the consistency suite (Q1-Q5, above rule).
#   persona_harness  playbook Step 8.1, run by the SEPARATE runner tests/step8_harness.py (not on every change):
#                    30 base questions x 3 phrasings (planning / procurement / logistics vocabulary). Each phrasing
#                    goes through Cortex Analyst on SV_SUPPLY_CHAIN; its SQL is executed as that persona role
#                    (secondary roles off) and compared with the golden SEMANTIC_VIEW() query below (run as SC_ADMIN).
#                    Every scope is APAC / EMEA plants, which all three personas can see (SC_LOGISTICS cannot see
#                    US01 / MX01), so one golden value is right for every persona. Phrasings use only metric
#                    synonyms from metric_contracts.md and entity synonyms from ontology.md §5.
#                    unit: pct = 0-1 fraction compared as 100 x value; days; usd. key: breakdown column (one value per
#                    key); none = exactly one row. Golden values are computed at run time; nothing is hard-coded.

questions:
  - id: Q1_CUSTOMER_OTD_PUNE_LAST_MONTH
    question: "What was on-time delivery for Pune last month?"
    run_as: [SC_PLANNER, SC_PROCUREMENT, SC_LOGISTICS]   # same number for every persona
    metric: CUSTOMER_OTD_PCT                             # unqualified OTD = Customer OTD % (contract §7)
    expected_query: >-
      SELECT * FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN
        DIMENSIONS plants.plant_code, dates.fiscal_month_label, dates.fiscal_month_start_date, dates.fiscal_month_end_date
        METRICS order_lines.customer_otd_pct, order_lines.on_time_lines, order_lines.due_lines,
                order_lines.outbound_arrival_evidence_coverage_pct
        WHERE plants.plant_code = 'IN01' AND dates.fiscal_month_offset = -1)
    answer_must_contain: [ROUND(100 * customer_otd_pct, 1) "%", "Customer OTD", fiscal_month_label,
                          first and last day of the fiscal month, evidence coverage]
    tool_sql_must_use: SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN
    expected_today: "23.4%, FY2026-P09, 24 Aug - 27 Sep 2026, evidence coverage 96.4%"

  - id: Q2_TRUCK_FILL_RATE_REFUSED
    question: "What's our truck fill rate?"
    run_as: [SC_ADMIN]
    metric: none (Trailer Utilization, not canonical, contract §7)
    expected_query: none
    answer_must: [explain it is not canonical, give no percentage, offer Fill Rate %]
    tools_must_not_include: [supply_chain_metrics, system_execute_sql, expedite_po, flag_supplier]
    expected_today: "refused, Fill Rate % offered"

  - id: Q3_DOI_DE01
    question: "Days of supply for plant DE01"
    run_as: [SC_ADMIN]
    metric: DAYS_OF_INVENTORY                            # latest snapshot when no period is named (contract §5, §7.1)
    expected_query: >-
      SELECT * FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN
        DIMENSIONS plants.plant_code
        METRICS inventory.doi_snapshot_date, inventory.days_of_inventory, inventory.doi_evidence_coverage_pct
        WHERE plants.plant_code = 'DE01')
    answer_must_contain: [ROUND(days_of_inventory, 1), doi_snapshot_date as YYYY-MM-DD, "Days of Inventory"]
    tool_sql_must_use: SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN
    expected_today: "28.0 days as of 2026-10-02"

  - id: Q4_BELOW_CONTRACT_TARGET_KRONOS_PENALTY
    question: "Which suppliers are below their contracted OTD target, and what penalty applies to Kronos?"
    run_as: [SC_ADMIN]
    metric: SUPPLIER_CONTRACTUAL_OTD_PCT / SUPPLIER_CONTRACTUAL_OTD_GAP   # named variant, last complete calendar month (§3.1)
    expected_query: >-
      SELECT * FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN
        DIMENSIONS suppliers.supplier_no, dates.calendar_month_label
        METRICS purchase_order_lines.supplier_contractual_otd_pct, purchase_order_lines.contracted_delivery_target,
                purchase_order_lines.contractual_pro_forma_po_lines
        WHERE dates.calendar_month_offset = -1 AND suppliers.supplier_no = '1000011')
      -- penalty terms, clause text and contract no.: contracts.contract_no, contract_penalty_clause,
      --   contract_late_penalty_per_day, contract_late_penalty_cap (clause masked for SC_LOGISTICS, sql/50)
    answer_must_contain: [Kronos contractual OTD %, contracted target %, calendar_month_label, "calendar month", "pro-forma",
                          contract_no, penalty % per day, penalty cap %]
    tools_must_include: [supply_chain_metrics]   # contract_search holds no penalty sections since sql/50 item 2 (optional here)
    expected_today: "Sep 2026 calendar month; Kronos 14.3% vs 96.0%; pro-forma (effective 2026-10-03);
                     CTR-S0011-2026 '2. Late-Delivery Penalty': 1.0% per day late, cap 8%, 1 grace day"

  - id: Q5_FLAG_KRONOS_ASKS_TO_CONFIRM
    question: "Flag Kronos Castings for late deliveries"
    run_as: [SC_ADMIN]
    metric: none (action)
    answer_must: [show what will be written, ask for confirmation]
    tools_must_not_include: [flag_supplier, expedite_po]
    audit_rows_written: 0
    second_turn: "yes -> flag_supplier called once, confirmation_id FLG-YYYYMMDD-XXXXXX returned
                  (smoke-tested only; the suite does not write audit rows)"

# =============================================================================
# persona_harness (playbook Step 8.1): python3 tests/step8_harness.py --part persona
# golden = SEMANTIC_VIEW() query as SC_ADMIN; metric = result column compared; tolerance 0.05 (pct points, days, USD).
# =============================================================================
persona_harness:
  semantic_view: SC.SEMANTIC.SV_SUPPLY_CHAIN
  tolerance: 0.05
  targets: {persona_consistency_pct: 100, golden_match_pct: 95}
  personas: {planning: SC_PLANNER, procurement: SC_PROCUREMENT, logistics: SC_LOGISTICS}
  base_questions:
    # ---------------- Customer OTD % ----------------
    - id: B01_CUSTOMER_OTD_IN01_LAST_MONTH
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.customer_otd_pct WHERE plants.plant_code = 'IN01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "What was OTD for Pune last month?"
        procurement: "Customer on-time delivery at the Pune factory for the previous month?"
        logistics: "Delivery reliability out of the Pune facility last month?"
    - id: B02_CUSTOMER_OTD_CN01_THIS_QUARTER
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.customer_otd_pct WHERE plants.plant_code = 'CN01' AND dates.fiscal_quarter_offset = 0)
      phrasings:
        planning: "Suzhou OTD % quarter to date"
        procurement: "What's customer OTD for the Suzhou plant this quarter?"
        logistics: "On-time to commit for shipments from Suzhou this quarter?"
    - id: B03_CUSTOMER_OTD_NL01_SEPTEMBER
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.customer_otd_pct WHERE plants.plant_code = 'NL01' AND dates.calendar_year = 2026 AND dates.calendar_month = 9)
      phrasings:
        planning: "What was on-time delivery for Rotterdam in September?"
        procurement: "Customer OTD at the Rotterdam site for September"
        logistics: "In September, what share of Rotterdam's customer order lines arrived on time?"
    - id: B04_CUSTOMER_OTD_DE01_ALL_HISTORY
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.customer_otd_pct WHERE plants.plant_code = 'DE01')
      phrasings:
        planning: "What is OTD for Stuttgart?"
        procurement: "Overall customer on-time delivery for the Stuttgart plant"
        logistics: "Line-level OTIF for the Stuttgart facility across all available history"
    - id: B05_CUSTOMER_OTD_APAC_LAST_MONTH
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_region METRICS order_lines.customer_otd_pct WHERE plants.plant_region = 'APAC' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "OTD % for the APAC region last month"
        procurement: "Last month's customer on-time delivery across our APAC plants"
        logistics: "How did on-time delivery look for APAC sites in the previous fiscal month?"
    - id: B06_CUSTOMER_OTD_BY_CATEGORY_EMEA_THIS_QUARTER
      metric: CUSTOMER_OTD_PCT
      unit: pct
      key: PART_CATEGORY
      golden: SELECT part_category, customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_category METRICS order_lines.customer_otd_pct WHERE plants.plant_region = 'EMEA' AND dates.fiscal_quarter_offset = 0)
      phrasings:
        planning: "OTD by product category for EMEA this quarter"
        procurement: "Break down customer OTD by material group for EMEA plants, quarter to date"
        logistics: "On-time delivery per category for our EMEA locations this quarter"
    - id: B07_CUSTOMER_OTD_PL01_HYDRAULICS_AUGUST
      metric: CUSTOMER_OTD_PCT
      unit: pct
      golden: SELECT customer_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code, parts.part_category METRICS order_lines.customer_otd_pct WHERE plants.plant_code = 'PL01' AND parts.part_category = 'Hydraulics' AND dates.calendar_year = 2026 AND dates.calendar_month = 8)
      phrasings:
        planning: "OTD for Hydraulics parts at Wroclaw in August"
        procurement: "Customer on-time delivery of the Hydraulics category from the Wroclaw factory, August"
        logistics: "In August, how on-time were Hydraulics deliveries out of Wroclaw?"
    # ---------------- Fill Rate % ----------------
    - id: B08_FILL_RATE_IN01_LAST_MONTH
      metric: FILL_RATE_PCT
      unit: pct
      golden: SELECT fill_rate_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.fill_rate_pct WHERE plants.plant_code = 'IN01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Fill rate for Pune last month"
        procurement: "What unit fill rate did the Pune plant achieve in the last fiscal month?"
        logistics: "Customer fill rate from the Pune site last month"
    - id: B09_FILL_RATE_SG01_THIS_QUARTER
      metric: FILL_RATE_PCT
      unit: pct
      golden: SELECT fill_rate_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.fill_rate_pct WHERE plants.plant_code = 'SG01' AND dates.fiscal_quarter_offset = 0)
      phrasings:
        planning: "Singapore fill rate QTD"
        procurement: "Quantity fill rate at the Singapore facility this quarter"
        logistics: "Demand fill rate for the Singapore location this quarter"
    - id: B10_FILL_RATE_PL01_AUGUST
      metric: FILL_RATE_PCT
      unit: pct
      golden: SELECT fill_rate_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS order_lines.fill_rate_pct WHERE plants.plant_code = 'PL01' AND dates.calendar_year = 2026 AND dates.calendar_month = 8)
      phrasings:
        planning: "Fill rate % for Wroclaw in August"
        procurement: "Customer fill rate at the Wroclaw plant for August"
        logistics: "Unit fill rate on deliveries from the Wroclaw site in August"
    - id: B11_FILL_RATE_EMEA_ALL_HISTORY
      metric: FILL_RATE_PCT
      unit: pct
      golden: SELECT fill_rate_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_region METRICS order_lines.fill_rate_pct WHERE plants.plant_region = 'EMEA')
      phrasings:
        planning: "What is our fill rate in EMEA?"
        procurement: "Overall unit fill rate for EMEA plants"
        logistics: "Fill rate across all EMEA facilities, all history"
    - id: B12_FILL_RATE_BY_CATEGORY_CN01_LAST_MONTH
      metric: FILL_RATE_PCT
      unit: pct
      key: PART_CATEGORY
      golden: SELECT part_category, fill_rate_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_category METRICS order_lines.fill_rate_pct WHERE plants.plant_code = 'CN01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Fill rate by category for Suzhou last month"
        procurement: "Break down quantity fill rate by material group at the Suzhou plant for the previous month"
        logistics: "Customer fill rate per product category from the Suzhou site last month"
    # ---------------- Supplier OTD % ----------------
    - id: B13_SUPPLIER_OTD_KRONOS_IN01_LAST_MONTH
      metric: SUPPLIER_OTD_PCT
      unit: pct
      golden: SELECT supplier_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS suppliers.supplier_name, plants.plant_code METRICS purchase_order_lines.supplier_otd_pct WHERE suppliers.supplier_name = 'Kronos Castings' AND plants.plant_code = 'IN01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Supplier OTD for Kronos Castings into Pune last month"
        procurement: "Vendor OTD of Kronos Castings at the Pune plant last month"
        logistics: "Inbound on-time delivery from Kronos Castings to the Pune site in the previous fiscal month"
    - id: B14_SUPPLIER_OTD_VELA_APAC_THIS_QUARTER
      metric: SUPPLIER_OTD_PCT
      unit: pct
      golden: SELECT supplier_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS suppliers.supplier_name, plants.plant_region METRICS purchase_order_lines.supplier_otd_pct WHERE suppliers.supplier_name = 'Vela Polymers' AND plants.plant_region = 'APAC' AND dates.fiscal_quarter_offset = 0)
      phrasings:
        planning: "Supplier OTD for Vela Polymers across APAC plants this quarter"
        procurement: "Vendor on-time delivery for Vela Polymers into APAC, quarter to date"
        logistics: "Inbound OTD from Vela Polymers to our APAC sites this quarter"
    - id: B15_SUPPLIER_OTD_DE01_SEPTEMBER
      metric: SUPPLIER_OTD_PCT
      unit: pct
      golden: SELECT supplier_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS purchase_order_lines.supplier_otd_pct WHERE plants.plant_code = 'DE01' AND dates.calendar_year = 2026 AND dates.calendar_month = 9)
      phrasings:
        planning: "Supplier OTD at Stuttgart in September"
        procurement: "Vendor OTD for all suppliers delivering to the Stuttgart factory in September"
        logistics: "Inbound on-time performance at the Stuttgart site for September"
    - id: B16_SUPPLIER_OTD_ACME_EMEA_ALL_HISTORY
      metric: SUPPLIER_OTD_PCT
      unit: pct
      golden: SELECT supplier_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS suppliers.supplier_name, plants.plant_region METRICS purchase_order_lines.supplier_otd_pct WHERE suppliers.supplier_name = 'Acme Components' AND plants.plant_region = 'EMEA')
      phrasings:
        planning: "Supplier OTD for Acme Components in EMEA"
        procurement: "What's Acme Components' vendor OTD across our EMEA plants?"
        logistics: "Inbound OTD from Acme Components into EMEA sites, all history"
    - id: B17_SUPPLIER_OTD_BY_CATEGORY_NL01_LAST_MONTH
      metric: SUPPLIER_OTD_PCT
      unit: pct
      key: PART_CATEGORY
      golden: SELECT part_category, supplier_otd_pct FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_category METRICS purchase_order_lines.supplier_otd_pct WHERE plants.plant_code = 'NL01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Supplier OTD by part category at Rotterdam last month"
        procurement: "Vendor OTD by material group for the Rotterdam plant, last month"
        logistics: "Inbound on-time delivery per category at the Rotterdam facility in the previous fiscal month"
    # ---------------- Days of Inventory ----------------
    - id: B18_DOI_DE01_LATEST
      metric: DAYS_OF_INVENTORY
      unit: days
      golden: SELECT days_of_inventory FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS inventory.days_of_inventory WHERE plants.plant_code = 'DE01')
      phrasings:
        planning: "Days of supply for plant DE01"
        procurement: "How many days of inventory does the Stuttgart plant hold right now?"
        logistics: "Days on hand at the Stuttgart site"
    - id: B19_DOI_IN01_END_OF_LAST_MONTH
      metric: DAYS_OF_INVENTORY
      unit: days
      golden: SELECT days_of_inventory FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS inventory.days_of_inventory WHERE plants.plant_code = 'IN01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Days of supply at Pune at the end of last month"
        procurement: "Days of inventory at the Pune plant as of the end of the previous fiscal month"
        logistics: "What were days of cover at the Pune facility at last month's end?"
    - id: B20_DOI_SG01_CHEMICALS_LATEST
      metric: DAYS_OF_INVENTORY
      unit: days
      golden: SELECT days_of_inventory FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code, parts.part_category METRICS inventory.days_of_inventory WHERE plants.plant_code = 'SG01' AND parts.part_category = 'Chemicals')
      phrasings:
        planning: "Days of supply for Chemicals at Singapore"
        procurement: "Current days of inventory for the Chemicals category at the Singapore plant"
        logistics: "Days on hand for Chemicals at the Singapore location right now"
    - id: B21_DOI_BY_CATEGORY_NL01_LATEST
      metric: DAYS_OF_INVENTORY
      unit: days
      key: PART_CATEGORY
      golden: SELECT part_category, days_of_inventory FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_category METRICS inventory.days_of_inventory WHERE plants.plant_code = 'NL01')
      phrasings:
        planning: "Days of supply by product category at Rotterdam"
        procurement: "Days of inventory per material group at the Rotterdam plant, latest snapshot"
        logistics: "Inventory coverage in days by category at the Rotterdam site now"
    - id: B22_DOI_PL01_END_OF_SEPTEMBER
      metric: DAYS_OF_INVENTORY
      unit: days
      golden: SELECT days_of_inventory FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS plants.plant_code METRICS inventory.days_of_inventory WHERE plants.plant_code = 'PL01' AND dates.calendar_year = 2026 AND dates.calendar_month = 9)
      phrasings:
        planning: "Days of supply at Wroclaw at the end of September"
        procurement: "Days of inventory for the Wroclaw plant as of end of September"
        logistics: "Days of cover at the Wroclaw site at the end of September"
    # ---------------- Landed Cost per Unit (one Part) ----------------
    - id: B23_LCU_P000252_DE01_LAST_MONTH
      metric: LANDED_COST_PER_UNIT
      unit: usd
      golden: SELECT landed_cost_per_unit FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_no, plants.plant_code METRICS goods_receipts.landed_cost_per_unit WHERE parts.part_no = 'P000252' AND plants.plant_code = 'DE01' AND dates.fiscal_month_offset = -1)
      phrasings:
        planning: "Landed cost per unit for part P000252 at Stuttgart last month"
        procurement: "What was the LCU of P000252 received at the Stuttgart plant in the last fiscal month?"
        logistics: "Delivered cost per unit for P000252 into the Stuttgart site last month"
    - id: B24_LCU_P001551_IN01_ALL_HISTORY
      metric: LANDED_COST_PER_UNIT
      unit: usd
      golden: SELECT landed_cost_per_unit FROM SEMANTIC_VIEW(SC.SEMANTIC.SV_SUPPLY_CHAIN DIMENSIONS parts.part_no, plants.plant_code METRICS goods_receipts.landed_cost_per_unit WHERE parts.part_no = 'P001551' AND plants.plant_code = 'IN01')
      phrasings:
